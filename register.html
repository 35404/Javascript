<!DOCTYPE html>
<html lang="zh-CN">
<link rel="stylesheet" href="register.css">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 中华菜馆</title>
</head>

<body>
  <div class="header">
    <h2>加入我们</h2>
    <p>注册账号，品味舌尖上的中国</p>
  </div>

  <div class="form-wrapper">
    <div class="form-card">
      <h3>创 建 账 号</h3>

      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请设置用户名" autocomplete="username">
        <span class="input-icon">&#128100;</span>
      </div>

      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请设置密码" autocomplete="new-password">
        <span class="input-icon">&#128274;</span>
      </div>

      <div class="form-group">
        <label>确认密码</label>
        <input type="password" id="confirm" placeholder="请再次输入密码" autocomplete="new-password">
        <span class="input-icon">&#128274;</span>
      </div>

      <button class="btn-submit" id="registerBtn">注 册</button>

      <div class="form-switch">
        已有账号？<a href="login.html">立即登录</a>
      </div>
      <div class="form-tip">注册即表示同意我们的服务条款</div>
    </div>
  </div>

  <footer class="page-footer">
    <p>中华菜馆 &copy; 2026</p>
    <p class="footer-sub">传承经典味道 · 品味中华美食</p>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="register.js"></script>
</body>

</html>
