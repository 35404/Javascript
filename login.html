<!DOCTYPE html>
<html lang="zh-CN">
<link rel="stylesheet" href="login.css">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 中华菜馆</title>
</head>

<body>
  <div class="header">
    <h2>欢迎回来</h2>
    <p>登录您的账号，开启中华美食之旅</p>
  </div>

  <div class="form-wrapper">
    <div class="form-card">
      <h3>账 号 登 录</h3>

      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
        <span class="input-icon">&#128100;</span>
      </div>

      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
        <span class="input-icon">&#128274;</span>
      </div>

      <button class="btn-submit" id="loginBtn">登 录</button>

      <div class="form-switch">
        还没有账号？<a href="register.html">立即注册</a>
      </div>
      <div class="form-tip">登录即表示同意我们的服务条款</div>
    </div>
  </div>

  <footer class="page-footer">
    <p>中华菜馆 &copy; 2026</p>
    <p class="footer-sub">传承经典味道 · 品味中华美食</p>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="login.js"></script>
</body>

</html>
